  <text x="1120" y="90" text-anchor="end" font-size="17" font-weight="700" fill="#6d28d9" letter-spacing="4.5">SPEC · DRAFT 0.0.1</text>
  <text x="78" y="258" font-size="50" font-weight="800" fill="#16181d" letter-spacing="-1.6">Pools should pool rewards,</text>
  <text x="78" y="322" font-size="44" font-style="italic" font-weight="600" fill="#37414d" letter-spacing="-0.6">not <tspan fill="#6d28d9" font-weight="700">blocks</tspan>.</text>
  <text x="80" y="392" font-size="22" fill="#5b6470">Your node builds the block. A signed share proves the work.</text>
  <text x="80" y="422" font-size="22" fill="#5b6470">The coinbase pays you directly. No custody, no mandatory fee.</text>
  <g>
