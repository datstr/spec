    <text x="80" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">FEE</text>
    <text x="250" y="540" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#16181d">4</text>
    <text x="250" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">CHAINS</text>
    <text x="400" y="540" font-family="DejaVu Sans Mono, monospace" font-size="54" font-weight="700" fill="#16181d">1</text>
    <text x="400" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">KERNEL</text>
    <text x="560" y="540" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700" fill="#6d28d9">datstr.com</text>
    <text x="560" y="572" font-size="15" font-weight="700" fill="#5b6470" letter-spacing="2">RUNS IN YOUR BROWSER</text>
  </g>
  <g filter="url(#soft)"><rect x="852" y="150" width="288" height="330" rx="18" fill="#ffffff" stroke="#e6e8eb" stroke-width="1.5"/></g>
  <text x="884" y="194" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#6d28d9" letter-spacing="2.5">THE SPEC</text>
  <line x1="884" y1="210" x2="1108" y2="210" stroke="#eef0f2" stroke-width="1.5"/>
  <g font-size="19" fill="#16181d">
    <text x="912" y="248">Principles</text><text x="912" y="288">Identity, did:nostr</text><text x="912" y="328">Shares and the split</text><text x="912" y="368">Documents in a pod</text><text x="912" y="408">Levels 1 to 3</text><text x="912" y="448">Acceptance test</text>
